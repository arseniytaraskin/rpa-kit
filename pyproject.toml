[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-kit"
version = "0.1.0"
description = "Reusable functional modules for RPA robots"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "selenium>=4.26,<5",
    "oracledb>=2.0,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
